services:

  postgres:
    image: postgres:16

    container_name: field_service_postgres

    environment:
      POSTGRES_DB: field_service_db
      POSTGRES_USER: field_service_user
      POSTGRES_PASSWORD: field_service_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: